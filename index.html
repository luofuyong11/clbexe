<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宠老板</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
    }

    .myFrame {
      width: 100%;
      height: calc(100% - 30px);
      vertical-align: bottom;
    }

    .ant-spin-wrap {
      width: 18px;
      height: 18px;
      display: block;
      transition: all 1s;
      margin-left: 5px;
    }

    .ant-spin {
      display: flex;
      flex-flow: column nowrap;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;

    }

    .ant-spin-dot {
      position: relative;
      font-size: 20px;
      width: 100%;
      height: 100%;
    }

    .ant-spin-dot-item {
      position: absolute;
      display: block;
      width: 9px;
      height: 9px;
      background: #FFDD03;
      border-radius: 100%;
      transform: scale(.75);
      transform-origin: 50% 50%;
      opacity: .3;
      animation-name: css-mxhywb-antSpinMove;
      animation-duration: 1s;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
      animation-direction: alternate;
    }

    .ant-spin-dot i {
      width: 9px;
      height: 9px;
    }

    .ant-spin-dot-spin {
      transform: rotate(45deg);
      animation-name: css-mxhywb-antRotate;
      animation-duration: 1.2s;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
    }

    .ant-spin-dot-item:nth-child(1) {
      top: 0;
      inset-inline-start: 0;
    }

    .ant-spin-dot-item:nth-child(2) {
      top: 0;
      inset-inline-end: 0;
      animation-delay: .4s;
    }

    .ant-spin-dot-item:nth-child(3) {
      inset-inline-end: 0;
      bottom: 0;
      animation-delay: .8s;
    }

    .ant-spin-dot-item:nth-child(4) {
      bottom: 0;
      inset-inline-start: 0;
      animation-delay: 1.2s;
    }

    .ant-spin-text {
      color: #1677ff;
      font-size: 14px;
    }

    @keyframes css-mxhywb-antSpinMove {
      100% {
        opacity: 1;
      }
    }

    @keyframes css-mxhywb-antRotate {
      100% {
        transform: rotate(405deg);
      }
    }
    .op-btns-row-wrap{
      -webkit-app-region: drag;
    }
    .op-btns-row {
      width: 100%;
      background: #F7F7F7;
      padding: 5px 20px;
      box-sizing: border-box;
      display: flex;
      flex-flow: row nowrap;
      justify-content: flex-start;
      align-items: center;      
    }

    .op-btn-wrap {
      width: 20px;
      height: 20px;
      cursor: pointer;
      transition: all 0.3s;
      -webkit-app-region: no-drag;
    }

    .switch-qh {
      width: 18px;
      height: 18px;
      cursor: pointer;
      transition: all 0.3s;
      margin-left: 5px;
    }

    .op-btns-row .op-btn-wrap:active {
      transform: scale(0.8);
    }

    .op-btns-row .goback {
      margin-right: 5px;
    }

    .op-btns-row .freshen {
      margin-left: 15px;
    }

    .op-btn-pic {
      width: 20px;
      height: 20px;
      display: block;
    }

    .op-btn-qh-pic {
      width: 18px;
      height: 18px;
      display: block;
    }

    .switch-lines {
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      position: fixed;
      top: 0px;
      left: 0px;
      z-index: 999;
      display: none;
      animation: changeBg 0.6s;
    }

    .switch-lines-wrap {
      width: 436px;
      /* height: 454px; */
      background: #FFFFFF;
      border-radius: 6px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      overflow: hidden;
      animation: changeSize 0.2s;
    }

    .switch-lines-wrap-top {
      width: 100%;
      height: 105px;
      background: #FFDD03;
      display: flex;
      flex-flow: row nowrap;
      justify-content: center;
      align-items: center;
    }

    .switch-lines-wrap-top-pic {
      width: 236px;
      height: 78px;
    }

    .switch-lines-wrap-bottom {
      padding: 19px 0px 20px 64px;
      box-sizing: border-box;
    }

    .switch-lines-wrap-bottom-item {
      font-size: 16px;
      font-family: PingFangSC-Medium, PingFang SC;
      font-weight: 600;
      color: #411E14;
      display: flex;
      flex-flow: row wrap;
      justify-content: flex-start;
      align-items: center;
    }

    .switch-lines-wrap-bottom-item-left {
      width: 80px;
      text-align: justify;
      text-align-last: justify;
      line-height: 44px;
    }

    .switch-lines-wrap-bottom-item-right {
      margin-left: 8px;
      line-height: 44px;
    }

    .switch-lines-wrap-bottom-item-drop {
      width: 210px;
      height: 37px;
      background: #FFFFFF;
      border-radius: 4px;
      border: 1px solid #DDDDDD;
      padding: 9px 13px 9px 26px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: PingFangSC-Regular, PingFang SC;
      font-weight: 600;
      color: #411E14;
      margin-left: 8px;
      display: flex;
      flex-flow: row nowrap;
      justify-content: space-between;
      align-items: center;
    }
    .switch-scale-wrap-bottom-item-drop{
      width: 210px;
      height: 37px;
      background: #FFFFFF;
      border-radius: 4px;
      border: 1px solid #DDDDDD;
      padding: 9px 13px 9px 26px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: PingFangSC-Regular, PingFang SC;
      font-weight: 600;
      color: #411E14;
      margin-left: 8px;
      display: flex;
      flex-flow: row nowrap;
      justify-content: space-between;
      align-items: center;
    }
    .item-drop-icon {
      width: 10px;
      height: 6px;
      transition: all 0.6s;
    }
    .item-scale-icon{
      width: 10px;
      height: 6px;
      transition: all 0.6s;
    }
    .switch-lines-wrap-bottom-item-sub {
      width: 210px;
      background: #FFFFFF;
      border-radius: 4px;
      border: 1px solid #DDDDDD;
      font-size: 14px;
      font-family: PingFangSC-Regular, PingFang SC;
      font-weight: 600;
      color: #411E14;
      margin-left: 93px;
      box-sizing: border-box;
      display: none;
    }
    .switch-scale-wrap-bottom-item-sub{
      width: 210px;
      background: #FFFFFF;
      border-radius: 4px;
      border: 1px solid #DDDDDD;
      font-size: 14px;
      font-family: PingFangSC-Regular, PingFang SC;
      font-weight: 600;
      color: #411E14;
      margin-left: 93px;
      box-sizing: border-box;
      display: none;
    }
    .switch-lines-item {
      text-align: left;
      height: 31px;
      line-height: 31px;
      cursor: pointer;
      padding: 0px 13px 0px 30px;
      /* box-sizing: border-box; */
    }

    .switch-lines-wrap-bottom-item-sub .switch-lines-item:hover {
      background: #FFF39F;
    }
    .switch-scale-wrap-bottom-item-sub .switch-lines-item:hover {
      background: #FFF39F;
    }
    .switch-bottom-copyright {
      font-size: 12px;
      font-family: PingFangSC-Regular, PingFang SC;
      font-weight: 400;
      color: #411E14;
      line-height: 22px;
    }


    @keyframes changeBg {
      0% {
        background: rgba(0, 0, 0, 0);
      }

      100% {
        background: rgba(0, 0, 0, 0.6);
      }
    }

    @keyframes changeSize {
      0% {
        left: 100%;
        top: 0%;
      }

      100% {
        left: 50%;
        top: 50%;
      }
    }
    .op-btns-row-right{
      flex: 1;
      display: flex;
      flex-flow: row nowrap;
      justify-content: flex-end;
      align-items: center;
    }
    .ck-op{
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .ck-op-pic{
      width: 18px;
      height: 18px;
      display: block;
    }
  </style>
</head>

<body>
