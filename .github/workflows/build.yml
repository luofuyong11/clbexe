name: Build Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            command: npm run make:win32:x64
            artifact_name: chonglaoban-win32-x64
            artifact_path: out/make/squirrel.windows/x64/**
          - name: windows-ia32
            os: windows-latest
            command: npm run make:win32:ia32
            artifact_name: chonglaoban-win32-ia32
            artifact_path: out/make/squirrel.windows/ia32/**

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  build-macos:
    name: ${{ matrix.name }}
    needs: build-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-13
            command: npm run make:mac:x64
            artifact_name: chonglaoban-macos-x64
            artifact_path: |
              out/make/zip/darwin/x64/**
              out/make/**/*.dmg
          - name: macos-arm64
            os: macos-13
            command: npm run make:mac:arm64
            artifact_name: chonglaoban-macos-arm64
            artifact_path: |
              out/make/zip/darwin/arm64/**
              out/make/**/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: ${{ matrix.command }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
