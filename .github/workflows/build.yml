name: Build Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            arch: x64
            os: windows-latest
            command: npm run dist:win32:x64
            artifact_name: chonglaoban-win32-x64
            artifact_path: |
              out/make/squirrel.windows/x64/*Setup.exe
              out/make/squirrel.windows/x64/*.nupkg
              out/make/squirrel.windows/x64/RELEASES
              out/make/nsis/x64/*.exe
          - name: windows-ia32
            arch: ia32
            os: windows-latest
            command: npm run dist:win32:ia32
            artifact_name: chonglaoban-win32-ia32
            artifact_path: |
              out/make/squirrel.windows/ia32/*Setup.exe
              out/make/squirrel.windows/ia32/*.nupkg
              out/make/squirrel.windows/ia32/RELEASES
              out/make/nsis/ia32/*.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: ${{ matrix.command }}

      - name: Verify Windows installer artifacts
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "out/make/squirrel.windows/${{ matrix.arch }}" -Filter "*Setup.exe" -File
          if (-not $setup) {
            Write-Error "Windows Squirrel Setup.exe 未生成"
          }
          $wizard = Get-ChildItem -Path "out/make/nsis/${{ matrix.arch }}" -Filter "*.exe" -File
          if (-not $wizard) {
            Write-Error "Windows 可选安装路径的向导安装器未生成"
          }
          $setup | Select-Object -ExpandProperty FullName
          $wizard | Select-Object -ExpandProperty FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  build-macos:
    name: macos
    needs: build-windows
    runs-on: macos-13
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.0
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build macOS x64 package
        run: npm run make:mac:x64

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chonglaoban-macos-x64
          path: |
            out/make/zip/darwin/x64/**
            out/make/**/*.dmg
          if-no-files-found: error

      - name: Clean macOS make artifacts
        run: rm -rf out/make

      - name: Build macOS arm64 package
        run: npm run make:mac:arm64

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chonglaoban-macos-arm64
          path: |
            out/make/zip/darwin/arm64/**
            out/make/**/*.dmg
          if-no-files-found: error
